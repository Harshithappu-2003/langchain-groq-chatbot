<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groq AI Assistant</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --secondary-color: #64748b;
      --background-color: #f8fafc;
      --sidebar-color: #1e293b;
      --chat-bg: #ffffff;
      --user-message: #2563eb;
      --bot-message: #f1f5f9;
      --border-color: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
    }

    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--background-color);
      height: 100vh;
      overflow: hidden;
    }

    .main-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
      color: white;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.1);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
    }

    .header .subtitle {
      font-size: 0.875rem;
      opacity: 0.9;
      margin: 0;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
      margin: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      background: linear-gradient(to bottom, #ffffff 0%, #f8fafc 100%);
    }

    .message {
      margin-bottom: 1.5rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .message.bot {
      display: flex;
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      position: relative;
      word-wrap: break-word;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--user-message) 0%, #1d4ed8 100%);
      color: white;
      border-bottom-right-radius: 0.25rem;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .message.bot .message-bubble {
      background-color: var(--bot-message);
      color: var(--text-primary);
      border-bottom-left-radius: 0.25rem;
      border: 1px solid var(--border-color);
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0.75rem;
      flex-shrink: 0;
    }

    .user-avatar {
      background: linear-gradient(135deg, #64748b 0%, #475569 100%);
      color: white;
    }

    .bot-avatar {
      background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
      color: white;
    }

    .message-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
      text-align: right;
    }

    .bot .message-time {
      text-align: left;
    }

    .input-area {
      padding: 1.5rem;
      background-color: #ffffff;
      border-top: 1px solid var(--border-color);
    }

    .input-group {
      position: relative;
    }

    .form-control {
      border: 2px solid var(--border-color);
      border-radius: 25px;
      padding: 0.875rem 3.5rem 0.875rem 1.25rem;
      font-size: 0.95rem;
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      background-color: #ffffff;
    }

    .send-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      background-color: var(--bot-message);
      border-radius: 1rem;
      border-bottom-left-radius: 0.25rem;
      border: 1px solid var(--border-color);
      max-width: 70px;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-secondary);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% { 
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }

    .welcome-message {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    .welcome-message .icon {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    /* Scrollbar Styling */
    .messages-area::-webkit-scrollbar {
      width: 6px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: var(--text-secondary);
      border-radius: 10px;
    }

    .messages-area::-webkit-scrollbar-thumb:hover {
      background: var(--text-primary);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-container {
        margin: 0;
      }
      
      .chat-container {
        margin: 1rem;
        border-radius: 8px;
      }
      
      .message-bubble {
        max-width: 85%;
      }
      
      .header {
        padding: 1rem;
      }
      
      .header h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Header -->
    <div class="header">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h1><i class="bi bi-robot me-2"></i>Groq AI Assistant</h1>
          <p class="subtitle mb-0">
            <span class="status-indicator"></span>
            Powered by Groq • Ultra-fast inference
          </p>
        </div>
        <div class="text-end">
          <small class="opacity-75">Online</small>
        </div>
      </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
      <!-- Messages Area -->
      <div id="messagesArea" class="messages-area">
        <div class="welcome-message">
          <div class="icon">
            <i class="bi bi-chat-dots"></i>
          </div>
          <h5>Welcome to Groq AI Assistant</h5>
          <p class="mb-0">Start a conversation by typing your message below. I'm here to help!</p>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-group">
          <input 
            type="text" 
            id="userInput" 
            class="form-control" 
            placeholder="Type your message here..." 
            autocomplete="off"
          >
          <button id="sendBtn" class="send-btn" type="button">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let isTyping = false;
    let messageCount = 0;

    // DOM Elements
    const messagesArea = document.getElementById('messagesArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      userInput.focus();
      
      // Enter key handler
      userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Send button handler
      sendBtn.addEventListener('click', sendMessage);
    });

    function getCurrentTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function createMessage(content, isUser = false) {
      messageCount++;
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
      
      if (isUser) {
        messageDiv.innerHTML = `
          <div class="message-bubble">
            ${content}
            <div class="message-time">${getCurrentTime()}</div>
          </div>
          <div class="message-avatar user-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
        `;
      } else {
        messageDiv.innerHTML = `
          <div class="message-avatar bot-avatar">
            <i class="bi bi-robot"></i>
          </div>
          <div class="message-bubble">
            ${content}
            <div class="message-time">${getCurrentTime()}</div>
          </div>
        `;
      }
      
      return messageDiv;
    }

    function addMessage(content, isUser = false) {
      // Remove welcome message if it exists
      const welcomeMsg = messagesArea.querySelector('.welcome-message');
      if (welcomeMsg) {
        welcomeMsg.remove();
      }

      const messageElement = createMessage(content, isUser);
      messagesArea.appendChild(messageElement);
      scrollToBottom();
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.id = 'typingIndicator';
      typingDiv.className = 'message bot';
      typingDiv.innerHTML = `
        <div class="message-avatar bot-avatar">
          <i class="bi bi-robot"></i>
        </div>
        <div class="typing-indicator">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      messagesArea.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const typingIndicator = document.getElementById('typingIndicator');
      if (typingIndicator) {
        typingIndicator.remove();
      }
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function setLoading(loading) {
      isTyping = loading;
      sendBtn.disabled = loading;
      userInput.disabled = loading;
      
      if (loading) {
        sendBtn.innerHTML = '<i class="bi bi-arrow-clockwise"></i>';
        sendBtn.style.animation = 'spin 1s linear infinite';
      } else {
        sendBtn.innerHTML = '<i class="bi bi-send-fill"></i>';
        sendBtn.style.animation = 'none';
      }
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message || isTyping) return;

      // Add user message
      addMessage(message, true);
      
      // Clear input and set loading state
      userInput.value = '';
      setLoading(true);
      
      // Show typing indicator
      showTypingIndicator();

      try {
        const response = await fetch("http://localhost:3000/chat", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ input: message }),
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        
        // Remove typing indicator
        removeTypingIndicator();
        
        // Add bot response
        addMessage(data.response || "I apologize, but I couldn't generate a response. Please try again.");
        
      } catch (error) {
        console.error('Error:', error);
        removeTypingIndicator();
        addMessage("I'm sorry, I'm having trouble connecting to the server. Please check your connection and try again.", false);
      } finally {
        setLoading(false);
        userInput.focus();
      }
    }

    // Add CSS animation for spinning
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        from { transform: translateY(-50%) rotate(0deg); }
        to { transform: translateY(-50%) rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
