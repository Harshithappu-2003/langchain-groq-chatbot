<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groq AI Assistant</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --chat-bg: rgba(255, 255, 255, 0.95);
      --user-message: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --bot-message: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --text-primary: #1a202c;
      --text-secondary: #718096;
      --shadow-light: 0 4px 30px rgba(0, 0, 0, 0.1);
      --shadow-medium: 0 8px 40px rgba(0, 0, 0, 0.15);
      --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--background);
      height: 100vh;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .main-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Animated Background Particles */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 1.5rem 2rem;
      box-shadow: var(--shadow-light);
      position: relative;
      z-index: 10;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle {
      font-size: 0.9rem;
      opacity: 0.9;
      margin: 0.25rem 0 0 0;
      font-weight: 400;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      background: var(--success-gradient);
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.75rem;
      animation: pulse 2s infinite;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 1;
        transform: scale(1);
      }
      50% { 
        opacity: 0.7;
        transform: scale(1.1);
      }
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      margin: 2rem;
      border-radius: 24px;
      box-shadow: var(--shadow-heavy);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 5;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(248,250,252,0.95) 100%);
      position: relative;
    }

    .message {
      margin-bottom: 2rem;
      animation: messageSlide 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .message.bot {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      max-width: 75%;
      padding: 1.25rem 1.5rem;
      border-radius: 20px;
      position: relative;
      word-wrap: break-word;
      line-height: 1.6;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .message.user .message-bubble {
      background: var(--user-message);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: var(--shadow-medium);
      position: relative;
      overflow: hidden;
    }

    .message.user .message-bubble::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
      pointer-events: none;
    }

    .message.bot .message-bubble {
      background: var(--bot-message);
      color: var(--text-primary);
      border-bottom-left-radius: 6px;
      border: 1px solid rgba(226, 232, 240, 0.5);
      box-shadow: var(--shadow-light);
    }

    .message-bubble:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-heavy);
    }

    .message-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 1rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-medium);
      transition: all 0.3s ease;
    }

    .message-avatar:hover {
      transform: scale(1.1);
    }

    .user-avatar {
      background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      color: white;
    }

    .bot-avatar {
      background: var(--primary-gradient);
      color: white;
      animation: avatarGlow 3s ease-in-out infinite;
    }

    @keyframes avatarGlow {
      0%, 100% {
        box-shadow: var(--shadow-medium);
      }
      50% {
        box-shadow: 0 8px 40px rgba(102, 126, 234, 0.4);
      }
    }

    .message-time {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 0.75rem;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }

    .bot .message-time {
      text-align: left;
      color: var(--text-secondary);
    }

    .input-area {
      padding: 2rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(248,250,252,0.9) 100%);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(226, 232, 240, 0.3);
    }

    .input-container {
      position: relative;
      max-width: 800px;
      margin: 0 auto;
    }

    .form-control {
      border: 2px solid rgba(226, 232, 240, 0.3);
      border-radius: 30px;
      padding: 1rem 4rem 1rem 1.5rem;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-light);
      backdrop-filter: blur(10px);
    }

    .form-control:focus {
      border-color: rgba(102, 126, 234, 0.5);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1), var(--shadow-medium);
      background: rgba(255, 255, 255, 1);
      transform: translateY(-2px);
    }

    .send-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--primary-gradient);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      box-shadow: var(--shadow-medium);
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-50%) scale(1.1);
      box-shadow: var(--shadow-heavy);
    }

    .send-btn:active:not(:disabled) {
      transform: translateY(-50%) scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bot-message);
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      border: 1px solid rgba(226, 232, 240, 0.5);
      max-width: 80px;
      box-shadow: var(--shadow-light);
    }

    .typing-dots {
      display: flex;
      gap: 6px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% { 
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }

    .welcome-message {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-secondary);
    }

    .welcome-message .icon {
      font-size: 4rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      animation: welcomeFloat 3s ease-in-out infinite;
    }

    @keyframes welcomeFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .welcome-message h5 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    /* Enhanced Scrollbar */
    .messages-area::-webkit-scrollbar {
      width: 8px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.3);
      border-radius: 10px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .messages-area::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.6), rgba(118, 75, 162, 0.6));
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-container {
        margin: 0;
      }
      
      .chat-container {
        margin: 1rem;
        border-radius: 16px;
      }
      
      .message-bubble {
        max-width: 85%;
        font-size: 0.9rem;
      }
      
      .header {
        padding: 1.25rem 1.5rem;
      }
      
      .header h1 {
        font-size: 1.5rem;
      }

      .messages-area {
        padding: 1.5rem;
      }

      .input-area {
        padding: 1.5rem;
      }
    }

    /* Loading animation */
    @keyframes spin {
      from { transform: translateY(-50%) rotate(0deg); }
      to { transform: translateY(-50%) rotate(360deg); }
    }

    .loading {
      animation: spin 1s linear infinite;
    }

    /* Micro interactions */
    .interactive:hover {
      transform: translateY(-1px);
      transition: transform 0.2s ease;
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="main-container">
    <!-- Header -->
    <div class="header glass-effect">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h1><i class="bi bi-robot me-3"></i>Groq AI Assistant</h1>
          <p class="subtitle mb-0">
            <span class="status-indicator"></span>
            Powered by Groq • Ultra-fast inference • Next-gen AI
          </p>
        </div>
        <div class="text-end">
          <small class="opacity-75 interactive">
            <i class="bi bi-circle-fill text-success me-1" style="font-size: 0.5rem;"></i>
            Online
          </small>
        </div>
      </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
      <!-- Messages Area -->
      <div id="messagesArea" class="messages-area">
        <div class="welcome-message">
          <div class="icon">
            <i class="bi bi-chat-dots-fill"></i>
          </div>
          <h5>Welcome to Groq AI Assistant</h5>
          <p class="mb-0">Experience lightning-fast AI conversations. Start by typing your message below!</p>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-container">
          <input 
            type="text" 
            id="userInput" 
            class="form-control" 
            placeholder="Type your message here..." 
            autocomplete="off"
          >
          <button id="sendBtn" class="send-btn" type="button">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let isTyping = false;
    let messageCount = 0;

    // DOM Elements
    const messagesArea = document.getElementById('messagesArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Create animated particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
        particlesContainer.appendChild(particle);
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      createParticles();
      userInput.focus();
      
      // Enter key handler
      userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Send button handler
      sendBtn.addEventListener('click', sendMessage);

      // Input focus effects
      userInput.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });

      userInput.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });

    function getCurrentTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function createMessage(content, isUser = false) {
      messageCount++;
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
      messageDiv.style.animationDelay = '0.1s';
      
      if (isUser) {
        messageDiv.innerHTML = `
          <div class="message-bubble interactive">
            ${content}
            <div class="message-time">${getCurrentTime()}</div>
          </div>
          <div class="message-avatar user-avatar interactive">
            <i class="bi bi-person-fill"></i>
          </div>
        `;
      } else {
        messageDiv.innerHTML = `
          <div class="message-avatar bot-avatar interactive">
            <i class="bi bi-robot"></i>
          </div>
          <div class="message-bubble interactive">
            ${content}
            <div class="message-time">${getCurrentTime()}</div>
          </div>
        `;
      }
      
      return messageDiv;
    }

    function addMessage(content, isUser = false) {
      // Remove welcome message if it exists
      const welcomeMsg = messagesArea.querySelector('.welcome-message');
      if (welcomeMsg) {
        welcomeMsg.style.animation = 'messageSlide 0.5s reverse';
        setTimeout(() => welcomeMsg.remove(), 500);
      }

      const messageElement = createMessage(content, isUser);
      messagesArea.appendChild(messageElement);
      scrollToBottom();
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.id = 'typingIndicator';
      typingDiv.className = 'message bot';
      typingDiv.innerHTML = `
        <div class="message-avatar bot-avatar">
          <i class="bi bi-robot"></i>
        </div>
        <div class="typing-indicator">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      messagesArea.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const typingIndicator = document.getElementById('typingIndicator');
      if (typingIndicator) {
        typingIndicator.style.animation = 'messageSlide 0.3s reverse';
        setTimeout(() => typingIndicator.remove(), 300);
      }
    }

    function scrollToBottom() {
      messagesArea.scrollTo({
        top: messagesArea.scrollHeight,
        behavior: 'smooth'
      });
    }

    function setLoading(loading) {
      isTyping = loading;
      sendBtn.disabled = loading;
      userInput.disabled = loading;
      
      if (loading) {
        sendBtn.innerHTML = '<i class="bi bi-arrow-clockwise"></i>';
        sendBtn.classList.add('loading');
      } else {
        sendBtn.innerHTML = '<i class="bi bi-send-fill"></i>';
        sendBtn.classList.remove('loading');
      }
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message || isTyping) return;

      // Add user message
      addMessage(message, true);
      
      // Clear input and set loading state
      userInput.value = '';
      setLoading(true);
      
      // Show typing indicator
      showTypingIndicator();

      try {
        const response = await fetch("http://localhost:3000/chat", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ input: message }),
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        
        // Remove typing indicator
        removeTypingIndicator();
        
        // Add bot response with slight delay for better UX
        setTimeout(() => {
          addMessage(data.response || "I apologize, but I couldn't generate a response. Please try again.");
        }, 300);
        
      } catch (error) {
        console.error('Error:', error);
        removeTypingIndicator();
        setTimeout(() => {
          addMessage("I'm sorry, I'm having trouble connecting to the server. Please check your connection and try again.", false);
        }, 300);
      } finally {
        setLoading(false);
        setTimeout(() => userInput.focus(), 100);
      }
    }
  </script>
</body>
</html>
